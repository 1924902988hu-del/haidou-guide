<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#010a13">
<meta name="description" content="海克斯大乱斗英雄攻略速查:天赋、技能加点、海克斯强化搭配、出装,支持昵称搜索与定位分类。">
<title>海斗速查 · 海克斯大乱斗英雄攻略</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="logo">⬡ 海斗<b>速查</b></div>
  <div class="patch-badge" id="patchBadge">加载中…</div>
</header>

<main class="container">
  <div class="searchbox">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8a99ac" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="搜英雄:名字 / 昵称(女枪、蛮王、EZ)/ 拼音" autocomplete="off">
  </div>

  <div class="role-tabs" id="roleTabs"></div>

  <div class="hero-grid" id="grid"></div>
  <div class="empty-tip" id="empty" hidden>没有匹配的英雄,换个昵称试试?</div>
</main>

<footer class="site-footer" id="footer"></footer>

<script src="assets/common.js"></script>
<script src="assets/index.js"></script>
</body>
</html>
