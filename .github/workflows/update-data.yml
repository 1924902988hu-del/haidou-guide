name: Update game data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore raw-source cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: |
            raw-data-

      - name: Refresh and validate all sources
        run: ./pipeline/update.sh

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/assets/img
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: automated refresh $(date -u +%F)"
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [update, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "[自动更新故障] 海斗速查数据同步失败";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            const failed = "${{ needs.update.result }}" !== "success" ||
              "${{ needs.deploy.result }}" !== "success";
            if (failed) {
              const body = [
                `自动更新或部署失败。`,
                ``,
                `- update: ${{ needs.update.result }}`,
                `- deploy: ${{ needs.deploy.result }}`,
                `- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "自动更新与部署已恢复，本故障单自动关闭。"
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed"
              });
            }
